name: CI

on:
  push:
    branches: [ "dev", "citest" ]
  pull_request:
    branches: [ "dev" ]

env:
  # Every built wheel runs `ftl --version` on each of these Python versions. Keep the list
  # in step with the `Programming Language :: Python :: 3.x` classifiers in pyproject.toml.
  WHEEL_TEST_PYTHONS: "3.11 3.12 3.13 3.14 3.15"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            libc: manylinux
          - os: ubuntu-latest
            arch: x86_64
            libc: musllinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: manylinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: musllinux
          - os: windows-latest
            arch: AMD64
          # Ahh... Why macOS is so expensive for CI builds...
          # - os: macos-14
          #   arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          version: "latest"
          activate-environment: "true"

      - name: Prepare the project for linting and testing
        shell: bash
        run: uv sync --no-install-project --group dev

      # On Linux, cibuildwheel compiles inside the manylinux/musllinux container, so the
      # host cargo cache only matters for the entry that runs `cargo llvm-cov` natively.
      # The default key ignores matrix values, hence the explicit per-entry key.
      - name: Rust cache
        if: runner.os != 'Linux' || (matrix.arch == 'x86_64' && matrix.libc == 'manylinux')
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}
          cache-targets: true

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        shell: bash
        env:
          CARGO_TERM_COLOR: "always"
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: Build and fix wheels (Windows)
        if: runner.os == 'Windows' && matrix.arch == 'AMD64'
        shell: bash
        env:
          CIBW_BUILD: "cp314-win_amd64"
        run: |
          uv run --no-project cibuildwheel --config-file pyproject.toml --output-dir wheelhouse --platform windows
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            for python in $WHEEL_TEST_PYTHONS; do
              uv run --no-project --python $python --with $wheel --refresh-package ftl_extract -- ftl --version
            done
          done

      - name: Build, fix and test wheels (macOS arm64)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        shell: bash
        env:
          CIBW_BUILD: "cp314-macosx_arm64"
        run: |
          uv run --no-project cibuildwheel --config-file pyproject.toml --output-dir wheelhouse --platform macos
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            for python in $WHEEL_TEST_PYTHONS; do
              uv run --no-project --python $python --with $wheel --refresh-package ftl_extract -- ftl --version
            done
          done

      # cibuildwheel copies the project into the container, so the wheel build cannot reuse
      # the host `target`. It mounts the host root at /host instead: cargo writes its target
      # directory through that mount to a host path outside the workspace, which this step
      # restores and saves. The key ends with the run id so a new rustc gets saved too; the
      # restore stays within one Cargo.lock so artifacts of old dependency versions do not
      # pile up.
      - name: Cache cibuildwheel target (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cibw-target
          key: cibw-target-${{ matrix.arch }}-${{ matrix.libc }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: cibw-target-${{ matrix.arch }}-${{ matrix.libc }}-${{ hashFiles('Cargo.lock') }}-

      - name: Build, fix and test wheels (Linux manylinux)
        if: runner.os == 'Linux' && matrix.libc == 'manylinux'
        shell: bash
        env:
          CARGO_TARGET_DIR: /host${{ runner.temp }}/cibw-target
          CIBW_ENVIRONMENT_PASS_LINUX: CARGO_TARGET_DIR
        run: |
          export CIBW_MANYLINUX_$(echo ${{ matrix.arch }} | tr '[:lower:]' '[:upper:]')_IMAGE="quay.io/pypa/manylinux_2_28_${{ matrix.arch }}"
          export CIBW_BUILD="cp314-manylinux_${{ matrix.arch }}"
          uv run --no-project cibuildwheel --config-file pyproject.toml --archs ${{ matrix.arch }} --output-dir wheelhouse --platform linux
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            for python in $WHEEL_TEST_PYTHONS; do
              uv run --no-project --python $python --with $wheel --refresh-package ftl_extract -- ftl --version
            done
          done

      - name: Build, fix and test wheels (Linux musllinux)
        if: runner.os == 'Linux' && matrix.libc == 'musllinux'
        shell: bash
        env:
          CARGO_TARGET_DIR: /host${{ runner.temp }}/cibw-target
          CIBW_ENVIRONMENT_PASS_LINUX: CARGO_TARGET_DIR
        run: |
          export CIBW_MUSLLINUX_$(echo ${{ matrix.arch }} | tr '[:lower:]' '[:upper:]')_IMAGE="quay.io/pypa/musllinux_1_2_${{ matrix.arch }}"
          export CIBW_BUILD="cp314-musllinux_${{ matrix.arch }}"
          uv run --no-project cibuildwheel --config-file pyproject.toml --archs ${{ matrix.arch }} --output-dir wheelhouse --platform linux
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            for python in $WHEEL_TEST_PYTHONS; do
              uv run --no-project --python $python --with $wheel --refresh-package ftl_extract -- ftl --version
            done
          done

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        shell: bash
        run: uv build --sdist --out-dir wheelhouse

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ftl_extract-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ github.run_id }}
          if-no-files-found: error
          path: wheelhouse/*
