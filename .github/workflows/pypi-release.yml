name: Release

# How a release goes out:
#
#   1. Merge `dev` into `master`, then push the version tag:
#        git tag vX.Y.Z master && git push origin vX.Y.Z
#      The tag push builds every wheel and the sdist and attaches them to the GitHub
#      release for that tag. A draft release is created if there is none; a draft you
#      already saved in the UI for that tag name is used as is.
#   2. Edit the draft's title and notes, look the assets over, then publish it. Publishing
#      downloads exactly those assets from the release and uploads them to PyPI. Nothing
#      is rebuilt, so what was inspected is what ships.
#
# GitHub does not run workflows for saving, editing or deleting a *draft* release, so a
# draft alone never starts a build: push the tag, or run the workflow manually from the
# Actions tab (pick the branch or tag to build from, name the release tag). The manual
# run also rebuilds and replaces the assets after a fix.
#
# Publishing a release whose tag was never pushed and never built fails in the publish
# job on purpose: it finds no assets. Build them (tag push or manual run) and re-run the
# publish job.

on:
  push:
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to attach the artifacts to, e.g. v0.13.0"
        required: true
        type: string

jobs:
  draft:
    name: 📝 Ensure a draft release exists
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # One job creates the draft so the seven build jobs cannot race each other into
      # creating seven of them. `gh release view` also finds drafts by tag name.
      - name: Create the draft if there is no release for the tag yet
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; the build jobs will attach to it."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$RELEASE_TAG" --notes "Draft created by the Release workflow. Edit the title and notes before publishing."
          fi

  build:
    name: 📦 Build wheels
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # attaching the assets to the release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            libc: manylinux
          - os: ubuntu-latest
            arch: x86_64
            libc: musllinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: manylinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: musllinux
          - os: windows-latest
            arch: AMD64
          - os: macos-14
            arch: arm64
          # Last Intel macOS image on GitHub Actions; supported until August 2027.
          - os: macos-15-intel
            arch: x86_64
    steps:
      # Builds the pushed tag, or the ref a manual run was started on.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "latest"
          activate-environment: "true"

      - name: Prepare the project for linting and testing
        shell: bash
        run: uv sync --no-install-project --group dev

      # On Linux, cibuildwheel compiles inside the manylinux/musllinux container, so the
      # host cargo cache is never used there. The default key ignores matrix values, hence
      # the explicit per-entry key.
      - name: Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}
          cache-targets: true

      - name: Build and fix wheels (Windows)
        if: runner.os == 'Windows' && matrix.arch == 'AMD64'
        shell: bash
        env:
          CIBW_BUILD: "cp314-win_amd64"
        run: |
          uv run --no-project cibuildwheel --config-file pyproject.toml --output-dir wheelhouse --platform windows
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            uv run --no-project --verbose --with $wheel --refresh-package ftl_extract -- ftl --version
          done

      - name: Build, fix and test wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CIBW_BUILD: "cp314-macosx_${{ matrix.arch }}"
        run: |
          uv run --no-project cibuildwheel --config-file pyproject.toml --output-dir wheelhouse --platform macos
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            uv run --no-project --verbose --with $wheel --refresh-package ftl_extract -- ftl --version
          done

      - name: Build, fix and test wheels (Linux manylinux)
        if: runner.os == 'Linux' && matrix.libc == 'manylinux'
        shell: bash
        run: |
          export CIBW_MANYLINUX_$(echo ${{ matrix.arch }} | tr '[:lower:]' '[:upper:]')_IMAGE="quay.io/pypa/manylinux_2_28_${{ matrix.arch }}"
          export CIBW_BUILD="cp314-manylinux_${{ matrix.arch }}"
          uv run --no-project cibuildwheel --config-file pyproject.toml --archs ${{ matrix.arch }} --output-dir wheelhouse --platform linux
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            uv run --no-project --verbose --with $wheel --refresh-package ftl_extract -- ftl --version
          done

      - name: Build, fix and test wheels (Linux musllinux)
        if: runner.os == 'Linux' && matrix.libc == 'musllinux'
        shell: bash
        run: |
          export CIBW_MUSLLINUX_$(echo ${{ matrix.arch }} | tr '[:lower:]' '[:upper:]')_IMAGE="quay.io/pypa/musllinux_1_2_${{ matrix.arch }}"
          export CIBW_BUILD="cp314-musllinux_${{ matrix.arch }}"
          uv run --no-project cibuildwheel --config-file pyproject.toml --archs ${{ matrix.arch }} --output-dir wheelhouse --platform linux
          for wheel in wheelhouse/*.whl; do
            uv run --no-project wheel tags --python-tag py3 --abi-tag none --remove $wheel
          done
          for wheel in wheelhouse/*.whl; do
            uv run --no-project --verbose --with $wheel --refresh-package ftl_extract -- ftl --version
          done

      - name: Build sdist
        if: runner.os == 'Linux' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        shell: bash
        run: uv build --sdist --out-dir wheelhouse

      # The wheels above are built from the source tree. Building one from the sdist is the
      # only thing that proves the sdist itself is complete (e.g. every cargo target it
      # declares is shipped), which is what source installs from PyPI rely on.
      - name: Build a wheel from the sdist
        if: runner.os == 'Linux' && matrix.arch == 'x86_64' && matrix.libc == 'manylinux'
        shell: bash
        run: uv build --wheel --out-dir sdist-check wheelhouse/*.tar.gz

      # `--clobber` lets a manual re-run replace assets of the same name.
      - name: Attach the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lah wheelhouse
          gh release upload "$RELEASE_TAG" wheelhouse/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: 🐍 Publish distribution 📦
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download the assets attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'; then
            echo "::error::No wheels are attached to $RELEASE_TAG. Push the tag or run the Release workflow manually so the build job attaches them, then re-run this job."
            exit 1
          fi
          ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
