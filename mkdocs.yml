site_name: FTL-Extract
site_description: Extract Fluent keys from Python code, keep .ftl files in sync, generate stubs and validate translations.
site_url: https://ftl-extract.readthedocs.io/
repo_url: https://github.com/andrew000/FTL-Extract
repo_name: andrew000/FTL-Extract
edit_uri: edit/dev/docs/
copyright: Copyright &copy; Andrew King. MIT License.
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Commands:
      - commands/index.md
      - ftl extract: commands/extract.md
      - ftl stub: commands/stub.md
      - ftl check: commands/check.md
      - ftl config: commands/config.md
  - Concepts:
      - How keys are found: concepts/keys.md
      - File layout and _path: concepts/file-layout.md
      - Variables and kwargs: concepts/kwargs.md
      - Ignore markers: concepts/ignore-markers.md
  - CI integration: ci.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Contributing: contributing.md
